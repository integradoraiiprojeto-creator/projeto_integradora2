<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWS Sinais Vitais • Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK v9 compat — versão estável -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary:#38bdf8; --primary-dim:rgba(56,189,248,0.12);
      --bg:#040d1a; --bg-card:rgba(6,16,36,0.95);
      --text:#e2eaf4; --text-muted:#6b87a8;
      --red:#f87171; --red-dim:rgba(248,113,113,0.12);
      --green:#34d399; --green-dim:rgba(52,211,153,0.12);
      --border:rgba(56,189,248,0.12); --border-soft:rgba(255,255,255,0.05);
      --radius:18px; --radius-sm:10px; --shadow:0 24px 80px rgba(0,0,0,0.7);
    }
    *{margin:0;padding:0;box-sizing:border-box;} html,body{height:100%;}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
    body::before{content:'';position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(56,189,248,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.022) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
    body::after{content:'';position:fixed;top:-40%;left:-20%;width:70%;height:80%;background:radial-gradient(ellipse,rgba(56,189,248,0.05) 0%,transparent 65%);z-index:0;pointer-events:none;}

    .box{position:relative;z-index:1;background:var(--bg-card);padding:48px 44px;border-radius:var(--radius);width:100%;max-width:440px;box-shadow:var(--shadow);border:1px solid var(--border);animation:rise .5s cubic-bezier(.22,.68,0,1.2) both;}
    @keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

    .logo{text-align:center;margin-bottom:40px;}
    .logo-icon{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#0ea5e9,#38bdf8);font-size:24px;color:#fff;box-shadow:0 0 30px rgba(56,189,248,0.45);margin-bottom:16px;}
    .logo h1{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-bottom:6px;}
    .logo h1 span{color:var(--primary);}
    .logo p{color:var(--text-muted);font-size:.86rem;}

    .fg{margin-bottom:22px;}
    .fg label{display:block;margin-bottom:8px;font-size:.82rem;font-weight:600;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;}
    .fg label i{margin-right:7px;color:var(--primary);font-size:.78rem;}
    .fg input{width:100%;padding:14px 16px;background:rgba(10,24,52,0.8);border:1px solid var(--border);border-radius:var(--radius-sm);color:#fff;font-size:.95rem;font-family:'DM Sans',sans-serif;transition:all .25s;}
    .fg input::placeholder{color:var(--text-muted);opacity:.55;}
    .fg input:focus{outline:none;border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.1);background:rgba(14,30,60,.9);}
    .fg input.err{border-color:rgba(248,113,113,.6)!important;}

    .row-mid{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:.84rem;}
    .remember{display:flex;align-items:center;gap:8px;color:var(--text-muted);cursor:pointer;}
    .remember input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
    .forgot{color:var(--primary);text-decoration:none;font-size:.84rem;}
    .forgot:hover{text-decoration:underline;}

    .btn-main{width:100%;padding:16px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff;border:none;border-radius:var(--radius-sm);font-size:.97rem;font-weight:700;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;letter-spacing:.03em;}
    .btn-main:hover{background:linear-gradient(135deg,#0ea5e9,#0284c7);transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.35);}
    .btn-main:active{transform:translateY(0);}
    .btn-main:disabled{opacity:.55;cursor:not-allowed;transform:none;}

    .btn-sec{width:100%;padding:14px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:.93rem;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;}
    .btn-sec:hover{background:var(--primary-dim);border-color:rgba(56,189,248,.35);color:var(--primary);transform:translateY(-1px);}

    .alert{display:none;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-sm);font-size:.84rem;margin-bottom:22px;}
    .alert.show{display:flex;}
    .alert-error{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.25);}
    .alert-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,.25);}

    .or{display:flex;align-items:center;gap:12px;margin:4px 0 18px;color:var(--text-muted);font-size:.76rem;}
    .or::before,.or::after{content:'';flex:1;border-top:1px solid var(--border-soft);}

    .db-status{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;font-size:.72rem;color:var(--text-muted);font-family:'DM Mono',monospace;}
    .db-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);}
    .db-dot.checking{animation:dbPulse 1.2s infinite;}
    .db-dot.online{background:var(--green);}
    .db-dot.offline{background:var(--red);}
    @keyframes dbPulse{0%,100%{opacity:.25}50%{opacity:1}}

    .footer-note{text-align:center;margin-top:8px;color:var(--text-muted);font-size:.74rem;}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon"><i class="fas fa-heart-pulse"></i></div>
    <h1>EWS <span>Sinais Vitais</span></h1>
    <p>Sistema de Monitoramento de Pacientes</p>
  </div>

  <div class="alert alert-success" id="msgSucesso"><i class="fas fa-check-circle"></i><span id="txtSucesso"></span></div>
  <div class="alert alert-error"   id="msgErro"  ><i class="fas fa-exclamation-circle"></i><span id="txtErro"></span></div>

  <div class="fg">
    <label for="username"><i class="fas fa-user"></i>Usuário</label>
    <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
  </div>
  <div class="fg">
    <label for="password"><i class="fas fa-lock"></i>Senha</label>
    <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password">
  </div>

  <div class="row-mid">
    <label class="remember"><input type="checkbox" id="remember"> Lembrar-me</label>
    <a href="#" class="forgot">Esqueceu a senha?</a>
  </div>

  <button class="btn-main" id="btnEntrar"><i class="fas fa-sign-in-alt"></i> Entrar no Sistema</button>
  <div class="or">ou</div>
  <button class="btn-sec" id="btnCadastrar"><i class="fas fa-user-plus"></i> Criar nova conta</button>

  <div class="db-status">
    <div class="db-dot checking" id="dbDot"></div>
    <span id="dbTxt"><i class="fas fa-database" style="margin-right:5px;color:#f5820d;"></i>Firebase Firestore</span>
  </div>
  <div class="footer-note">© 2026 EWS Sinais Vitais · Acesso restrito</div>
</div>

<script>
  // ════════════════════════════════════════
  // FIREBASE — inicialização única e segura
  // ════════════════════════════════════════
  let db = null;

  function initFirebase() {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey:            "AIzaSyDURF1Z7S-O0y1mfc0Sf8sjY9KGLJwkYHY",
          authDomain:        "projeto-integradora-ii.firebaseapp.com",
          projectId:         "projeto-integradora-ii",
          storageBucket:     "projeto-integradora-ii.firebasestorage.app",
          messagingSenderId: "80939508930",
          appId:             "1:80939508930:web:9a2d2f9bf97be9eb98075b"
        });
      }
      // settings() PRECISA ser chamado logo após getFirestore(), antes de qualquer operação
      db = firebase.firestore();
      db.settings({ experimentalForceLongPolling: true, merge: true });
    } catch(e) {
      // "settings has already been called" = DB já iniciou, apenas reutiliza
      if (e.message && e.message.includes('settings')) {
        db = firebase.firestore();
      } else {
        console.error('[Firebase] Erro crítico:', e);
      }
    }
  }
  initFirebase();

  // Testa a conexão e atualiza o indicador visual
  async function checkConnection() {
    try {
      await db.collection('usuarios').limit(1).get();
      document.getElementById('dbDot').className = 'db-dot online';
      document.getElementById('dbTxt').innerHTML = '<i class="fas fa-database" style="margin-right:5px;color:#f5820d;"></i>Banco de dados conectado';
    } catch(e) {
      const ok = (e.code === 'permission-denied'); // conexão OK, só sem permissão total
      document.getElementById('dbDot').className = 'db-dot ' + (ok ? 'online' : 'offline');
      document.getElementById('dbTxt').innerHTML = ok
        ? '<i class="fas fa-database" style="margin-right:5px;color:#f5820d;"></i>Banco de dados conectado'
        : '<i class="fas fa-database" style="margin-right:5px;color:#f87171;"></i>Sem conexão com o banco';
    }
  }
  if (db) checkConnection();

  // ════════════════════════════════════════
  // UI
  // ════════════════════════════════════════
  const elUser    = document.getElementById('username');
  const elPass    = document.getElementById('password');
  const elRem     = document.getElementById('remember');
  const elErro    = document.getElementById('msgErro');
  const elErrT    = document.getElementById('txtErro');
  const elSuc     = document.getElementById('msgSucesso');
  const elSucT    = document.getElementById('txtSucesso');
  const btnEntrar = document.getElementById('btnEntrar');

  // Flash de cadastro bem-sucedido
  window.addEventListener('DOMContentLoaded', () => {
    const flash = sessionStorage.getItem('ews_flash');
    if (flash) {
      elSucT.textContent = flash;
      elSuc.classList.add('show');
      sessionStorage.removeItem('ews_flash');
      setTimeout(() => elSuc.classList.remove('show'), 5000);
    }
    // Restaura credenciais salvas
    try {
      const saved = localStorage.getItem('ews_creds');
      if (saved) {
        const {u, p} = JSON.parse(saved);
        elUser.value = u; elPass.value = p; elRem.checked = true;
      }
    } catch(e) {}
  });

  function showErr(msg) {
    elErrT.textContent = msg;
    elErro.classList.add('show');
    elUser.classList.add('err');
    elPass.classList.add('err');
    setTimeout(() => {
      elErro.classList.remove('show');
      elUser.classList.remove('err');
      elPass.classList.remove('err');
    }, 4500);
  }

  function setLoading(on) {
    btnEntrar.disabled = on;
    btnEntrar.innerHTML = on
      ? '<span class="spinner"></span> Verificando...'
      : '<i class="fas fa-sign-in-alt"></i> Entrar no Sistema';
  }

  // ════════════════════════════════════════
  // LOGIN
  // ════════════════════════════════════════
  async function doLogin() {
    const u = elUser.value.trim();
    const p = elPass.value;

    if (!u || !p) { showErr('Preencha usuário e senha.'); return; }
    if (!db)      { showErr('Banco de dados não disponível. Recarregue a página.'); return; }

    setLoading(true);
    try {
      const snap = await db.collection('usuarios')
        .where('username', '==', u)
        .where('password', '==', p)
        .limit(1).get();

      if (!snap.empty) {
        const user = { id: snap.docs[0].id, ...snap.docs[0].data() };
        if (elRem.checked) {
          localStorage.setItem('ews_creds', JSON.stringify({u, p}));
        } else {
          localStorage.removeItem('ews_creds');
        }
        sessionStorage.setItem('ews_sessao', JSON.stringify(user));
        window.location.href = 'dashboard.html';
      } else {
        // Diferencia "usuário não existe" de "senha errada"
        const snapUser = await db.collection('usuarios')
          .where('username', '==', u).limit(1).get();
        showErr(snapUser.empty
          ? 'Usuário não encontrado. Crie sua conta primeiro.'
          : 'Senha incorreta. Tente novamente.');
      }
    } catch(e) {
      console.error('[Login] Erro:', e);
      const msgs = {
        unavailable:        'Sem conexão com o servidor. Verifique sua internet.',
        'failed-precondition': 'Banco de dados temporariamente indisponível.',
        'permission-denied':   'Permissão negada. Contate o administrador.'
      };
      showErr(msgs[e.code] || 'Erro ao conectar ao banco de dados. Tente novamente.');
    } finally {
      setLoading(false);
    }
  }

  btnEntrar.addEventListener('click', doLogin);
  document.getElementById('btnCadastrar').addEventListener('click', () => {
    window.location.href = 'cadastro.html';
  });
  [elUser, elPass].forEach(el => {
    el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    el.addEventListener('input',   () => {
      elErro.classList.remove('show');
      el.classList.remove('err');
    });
  });
</script>
</body>
</html>
