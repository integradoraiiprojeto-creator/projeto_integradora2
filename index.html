<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWS Sinais Vitais • Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #38bdf8;
      --primary-dim: rgba(56,189,248,0.12);
      --bg: #040d1a;
      --bg-card: rgba(6,16,36,0.95);
      --bg-raised: rgba(10,24,52,0.85);
      --text: #e2eaf4;
      --text-muted: #6b87a8;
      --red: #f87171;
      --red-dim: rgba(248,113,113,0.12);
      --green: #34d399;
      --green-dim: rgba(52,211,153,0.12);
      --border: rgba(56,189,248,0.12);
      --border-soft: rgba(255,255,255,0.05);
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 24px 80px rgba(0,0,0,0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(56,189,248,0.022) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,189,248,0.022) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; top: -40%; left: -20%;
      width: 70%; height: 80%;
      background: radial-gradient(ellipse, rgba(56,189,248,0.05) 0%, transparent 65%);
      z-index: 0; pointer-events: none;
    }

    .login-box {
      position: relative; z-index: 1;
      background: var(--bg-card);
      padding: 48px 44px;
      border-radius: var(--radius);
      width: 100%; max-width: 440px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      animation: rise 0.5s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 60px; height: 60px; border-radius: 18px;
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      font-size: 24px; color: white;
      box-shadow: 0 0 30px rgba(56,189,248,0.45);
      margin-bottom: 16px;
    }
    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.7rem; font-weight: 800;
      color: var(--text); letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .logo h1 span { color: var(--primary); }
    .logo p { color: var(--text-muted); font-size: 0.86rem; }

    .form-group { margin-bottom: 22px; }
    .form-group label {
      display: block; margin-bottom: 8px;
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase;
    }
    .form-group label i { margin-right: 7px; color: var(--primary); font-size: 0.78rem; }
    .form-group input {
      width: 100%; padding: 14px 16px;
      background: rgba(10,24,52,0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: white; font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.25s;
    }
    .form-group input::placeholder { color: var(--text-muted); opacity: 0.55; }
    .form-group input:focus {
      outline: none;
      border-color: rgba(56,189,248,0.55);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
      background: rgba(14,30,60,0.9);
    }
    .form-group input.error { border-color: rgba(248,113,113,0.6) !important; }

    .row-mid {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px; font-size: 0.84rem;
    }
    .remember { display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer; }
    .remember input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
    .forgot { color: var(--primary); text-decoration: none; font-size: 0.84rem; }
    .forgot:hover { text-decoration: underline; }

    .btn-login {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: white; border: none;
      border-radius: var(--radius-sm);
      font-size: 0.97rem; font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      letter-spacing: 0.03em;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56,189,248,0.35);
    }
    .btn-login:active { transform: translateY(0); }

    .error-msg {
      display: none; align-items: center; gap: 10px;
      background: var(--red-dim); color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 0.84rem; margin-bottom: 22px;
    }
    .error-msg.show { display: flex; }

    .divider { border: none; border-top: 1px solid var(--border-soft); margin: 26px 0; }

    .hint-box {
      background: rgba(56,189,248,0.05);
      border: 1px solid rgba(56,189,248,0.12);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 0.76rem; color: var(--text-muted);
      font-family: 'DM Mono', monospace; line-height: 1.8;
    }
    .hint-box strong { color: var(--primary); font-weight: 500; display: block; margin-bottom: 4px; }

    .footer-note {
      text-align: center; margin-top: 28px;
      color: var(--text-muted); font-size: 0.74rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-heart-pulse"></i></div>
      <h1>EWS <span>Sinais Vitais</span></h1>
      <p>Sistema de Monitoramento de Pacientes</p>
    </div>

    <div class="error-msg" id="errorMsg">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorText">Usuário ou senha incorretos.</span>
    </div>

    <div class="form-group">
      <label for="username"><i class="fas fa-user"></i>Usuário</label>
      <input type="text" id="username" placeholder="Digite seu usuário" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password"><i class="fas fa-lock"></i>Senha</label>
      <input type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password">
    </div>

    <div class="row-mid">
      <label class="remember">
        <input type="checkbox" id="remember"> Lembrar-me
      </label>
      <a href="#" class="forgot" id="forgotLink">Esqueceu a senha?</a>
    </div>

    <button class="btn-login" id="btnLogin">
      <i class="fas fa-sign-in-alt"></i> Entrar no Sistema
    </button>

    <hr class="divider">

    <div class="hint-box">
      <strong>Credenciais de acesso:</strong>
      medico / saude123 &nbsp;&nbsp; enfermeiro / cuidado456<br>
      admin / admin2024 &nbsp;&nbsp; paciente / 1234
    </div>

    <div class="footer-note">© 2026 EWS Sinais Vitais · Acesso restrito</div>
  </div>

  <script>
    const USUARIOS = [
      { username: 'medico',     password: 'saude123',   nome: 'Dr. Silva',       perfil: 'Médico' },
      { username: 'enfermeiro', password: 'cuidado456', nome: 'Enf. Oliveira',   perfil: 'Enfermeiro' },
      { username: 'admin',      password: 'admin2024',  nome: 'Administrador',   perfil: 'Admin' },
      { username: 'paciente',   password: '1234',       nome: 'Paciente',        perfil: 'Paciente' }
    ];

    const inputUser = document.getElementById('username');
    const inputPass = document.getElementById('password');
    const errorMsg  = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    const remember  = document.getElementById('remember');

    // Carregar credenciais salvas
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('ews_creds');
        if (saved) {
          const { u, p } = JSON.parse(saved);
          inputUser.value = u;
          inputPass.value = p;
          remember.checked = true;
        }
      } catch(e) {}
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorMsg.classList.add('show');
      inputUser.classList.add('error');
      inputPass.classList.add('error');
      setTimeout(() => {
        errorMsg.classList.remove('show');
        inputUser.classList.remove('error');
        inputPass.classList.remove('error');
      }, 4000);
    }

    function doLogin() {
      const u = inputUser.value.trim();
      const p = inputPass.value;
      if (!u || !p) { showError('Preencha usuário e senha.'); return; }

      const user = USUARIOS.find(x => x.username === u && x.password === p);
      if (user) {
        if (remember.checked) {
          localStorage.setItem('ews_creds', JSON.stringify({ u, p }));
        } else {
          localStorage.removeItem('ews_creds');
        }
        sessionStorage.setItem('ews_user', JSON.stringify(user));
        window.location.href = 'dashboard.html';
      } else {
        showError('Usuário ou senha incorretos. Tente novamente.');
      }
    }

    document.getElementById('btnLogin').addEventListener('click', doLogin);
    [inputUser, inputPass].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
      el.addEventListener('input', () => {
        errorMsg.classList.remove('show');
        el.classList.remove('error');
      });
    });

    document.getElementById('forgotLink').addEventListener('click', e => {
      e.preventDefault();
      alert('Recuperação de senha em desenvolvimento.\nContate o administrador do sistema.');
    });
  </script>
</body>
</html>
