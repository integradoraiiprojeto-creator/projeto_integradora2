<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWS Sinais Vitais • Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:     #38bdf8;
      --primary-dim: rgba(56,189,248,0.12);
      --bg:          #040d1a;
      --bg-card:     rgba(6,16,36,0.92);
      --bg-raised:   rgba(10,24,52,0.85);
      --text:        #e2eaf4;
      --text-muted:  #6b87a8;
      --text-dim:    #3d5470;
      --red:         #f87171;
      --red-dim:     rgba(248,113,113,0.12);
      --green:       #34d399;
      --border-soft: rgba(255,255,255,0.04);
      --radius:      18px;
      --radius-sm:   10px;
      --shadow:      0 24px 80px rgba(0,0,0,0.7);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow:hidden;
    }
    body::before {
      content:''; position:fixed; inset:0; z-index:0;
      background-image: linear-gradient(rgba(56,189,248,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.022) 1px, transparent 1px);
      background-size:40px 40px; pointer-events:none;
    }
    body::after {
      content:''; position:fixed; top:-40%; left:-20%; width:70%; height:80%;
      background:radial-gradient(ellipse,rgba(56,189,248,0.05) 0%,transparent 65%); z-index:0; pointer-events:none;
    }
    .bg-glow { position:fixed; bottom:-30%; right:-10%; width:60%; height:70%; background:radial-gradient(ellipse,rgba(14,165,233,0.04) 0%,transparent 65%); z-index:0; pointer-events:none; }

    .login-wrapper { position:relative; z-index:2; width:100%; max-width:440px; padding:20px; animation:rise .55s cubic-bezier(.22,.68,0,1.2) both; }
    @keyframes rise { from{opacity:0;transform:translateY(28px) scale(0.97);} to{opacity:1;transform:none;} }

    .login-card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border-soft); padding:40px 36px 36px; box-shadow:var(--shadow); }

    .login-header { text-align:center; margin-bottom:32px; }
    .login-logo-icon { width:52px; height:52px; border-radius:14px; background:linear-gradient(135deg,#0ea5e9,#38bdf8); display:inline-flex; align-items:center; justify-content:center; font-size:22px; color:white; box-shadow:0 0 24px rgba(56,189,248,0.45); margin-bottom:14px; }
    .login-title { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; color:var(--text); letter-spacing:-0.02em; margin-bottom:4px; }
    .login-title span { color:var(--primary); }
    .login-subtitle { font-size:0.82rem; color:var(--text-muted); font-family:'DM Mono',monospace; letter-spacing:0.04em; }
    .login-divider { height:1px; background:var(--border-soft); margin:0 0 28px; }

    .form-group { margin-bottom:20px; }
    .form-label { display:block; font-size:0.75rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; font-family:'Syne',sans-serif; }
    .input-wrap { position:relative; }
    .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); font-size:0.85rem; pointer-events:none; transition:color 0.2s; }
    .form-input { width:100%; padding:13px 16px 13px 40px; border-radius:var(--radius-sm); background:var(--bg-raised); border:1px solid var(--border-soft); color:var(--text); font-size:0.95rem; font-family:'DM Sans',sans-serif; transition:all 0.22s; }
    .form-input::placeholder { color:var(--text-dim); }
    .form-input:focus { outline:none; border-color:rgba(56,189,248,0.4); box-shadow:0 0 0 3px rgba(56,189,248,0.1); background:rgba(10,24,52,0.95); }
    .input-wrap:focus-within .input-icon { color:var(--primary); }

    .error-message { display:none; align-items:center; gap:9px; background:var(--red-dim); border:1px solid rgba(248,113,113,0.3); color:var(--red); padding:11px 14px; border-radius:var(--radius-sm); margin-bottom:20px; font-size:0.85rem; }
    .error-message.visible { display:flex; animation:shake .35s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

    .btn-login { width:100%; padding:14px; border:none; border-radius:var(--radius-sm); background:linear-gradient(135deg,#0ea5e9,#38bdf8); color:white; font-size:0.95rem; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all 0.22s; display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 4px 20px rgba(56,189,248,0.2); margin-top:8px; }
    .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(56,189,248,0.4); }
    .btn-login:active { transform:translateY(0); }

    .login-footer { text-align:center; margin-top:24px; font-size:0.72rem; color:var(--text-dim); font-family:'DM Mono',monospace; display:flex; align-items:center; justify-content:center; gap:8px; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:livePulse 2s ease infinite; flex-shrink:0; }
    @keyframes livePulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,0.4);} 50%{opacity:0.6;box-shadow:0 0 0 4px rgba(52,211,153,0);} }

    .hint-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; padding-top:18px; border-top:1px solid var(--border-soft); }
    .hint-badge { font-family:'DM Mono',monospace; font-size:0.68rem; padding:4px 10px; border-radius:6px; background:var(--bg-raised); border:1px solid var(--border-soft); color:var(--text-muted); cursor:pointer; transition:all 0.18s; }
    .hint-badge:hover { border-color:rgba(56,189,248,0.25); color:var(--primary); }
    .hint-label { font-size:0.68rem; color:var(--text-dim); font-family:'DM Mono',monospace; width:100%; margin-bottom:4px; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo-icon"><i class="fas fa-heart-pulse"></i></div>
        <div class="login-title">EWS <span>Sinais Vitais</span></div>
        <div class="login-subtitle">Sistema de Monitoramento em Tempo Real</div>
      </div>

      <div class="login-divider"></div>

      <div class="error-message" id="errorMessage">
        <i class="fas fa-circle-exclamation"></i> Usuário ou senha inválidos
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">Usuário</label>
          <div class="input-wrap">
            <input class="form-input" type="text" id="username" placeholder="Digite seu usuário" autocomplete="username" required>
            <i class="fas fa-user input-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <div class="input-wrap">
            <input class="form-input" type="password" id="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <i class="fas fa-lock input-icon"></i>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="fas fa-arrow-right-to-bracket"></i> Entrar
        </button>

        <a href="cadastro.html" style="display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:12px;border-radius:var(--radius-sm);background:transparent;border:1px solid rgba(56,189,248,0.25);color:var(--text-muted);font-size:0.88rem;font-weight:600;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all 0.22s;margin-top:6px;" onmouseover="this.style.borderColor='rgba(56,189,248,0.5)';this.style.color='var(--primary)';this.style.background='rgba(56,189,248,0.06)'" onmouseout="this.style.borderColor='rgba(56,189,248,0.25)';this.style.color='var(--text-muted)';this.style.background='transparent'">
          <i class="fas fa-user-plus"></i> Criar conta
        </a>
      </form>

      <div class="hint-row">
        <div class="hint-label">Acesso rápido (teste):</div>
        <span class="hint-badge" onclick="fillUser('visitante','1234')">visitante / 1234</span>
        <span class="hint-badge" onclick="fillUser('adm','adm123')">adm / adm123</span>
        <span class="hint-badge" onclick="fillUser('enfermeiro','enf123')">enfermeiro / enf123</span>
      </div>
    </div>

    <div class="login-footer">
      <div class="live-dot"></div>
      © 2024 EWS Sinais Vitais · Todos os direitos reservados
    </div>
  </div>

  <script>
    // Usuários padrão (fallback caso Firebase esteja vazio)
    const defaultUsers = [
      { u: 'visitante',  p: '1234',   nome: 'Visitante',   perfil: 'Visita',         role: 'visitante',    pacienteVinculado: '' },
      { u: 'adm',        p: 'adm123', nome: 'Admin',        perfil: 'Administrador',  role: 'administrador',pacienteVinculado: '' },
      { u: 'enfermeiro', p: 'enf123', nome: 'Enf. Santos',  perfil: 'Enfermeiro',     role: 'enfermeiro',   pacienteVinculado: '' }
    ];

    const DB_URL = 'https://projeto-integradora-ii-default-rtdb.firebaseio.com';

    function fillUser(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
      document.getElementById('password').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl  = document.getElementById('errorMessage');
      const btn      = document.querySelector('.btn-login');

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';
      btn.disabled = true;

      let user = null;

      // 1. Tenta buscar no Firebase
      try {
        const res  = await fetch(`${DB_URL}/usuarios/${username}.json`);
        const data = await res.json();
        if (data && data.senha === password) {
          user = {
            login: data.login || username,
            nome:  data.nome,
            perfil: data.perfil,
            role:  data.role || data.perfil, // salva role em minúsculo
            pacienteVinculado: data.pacienteVinculado || data['paciente-vinc'] || '',
            setor:   data.setor   || '',
            turno:   data.turno   || '',
            email:   data.email   || '',
            crm:     data.crm     || '',
            coren:   data.coren   || '',
          };
        }
      } catch(e) {}

      // 2. Fallback: usuários padrão
      if (!user) {
        user = defaultUsers.find(x => x.u === username && x.p === password) || null;
      }

      btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Entrar';
      btn.disabled = false;

      if (user) {
        sessionStorage.setItem('usuarioLogado', JSON.stringify(user));
        sessionStorage.setItem('loginTime', new Date().toISOString());
        window.location.href = 'monitoramento.html';
      } else {
        errorEl.classList.remove('visible');
        void errorEl.offsetWidth;
        errorEl.classList.add('visible');
        setTimeout(() => errorEl.classList.remove('visible'), 4000);
      }
    });
  </script>
</body>
</html>
